// Development launcher. Not published.
evaluationDependsOn(':runtime')
evaluationDependsOn(':smoke')
evaluationDependsOn(':lwjgl3')
evaluationDependsOn(':smoke-mixin')
dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
}

def javaFor = { int version ->
    javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(version) }
}

def runtimeJar = project(':runtime').tasks.named('shadowJar')
def smokeJar = project(':smoke').tasks.named('jar')
def lwjgl3Jar = project(':lwjgl3').tasks.named('jar')
def smokeMixinJar = project(':smoke-mixin').tasks.named('jar')

def registerRun = { String name, String mode, int javaVersion, boolean lwjgl3 = false ->
    tasks.register(name, JavaExec) {
        group = 'lazarus'
        description = "Boots Forge 1.8.9 ($mode) on Java $javaVersion and exits at the main menu."
        dependsOn runtimeJar, smokeJar, smokeMixinJar, lwjgl3Jar
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'lol.trq.lazarus.harness.DevLaunch'
        def launcher = javaFor(javaVersion)
        def mods = [smokeJar.get().archiveFile.get().asFile.absolutePath]
        if (project.hasProperty('mixin')) mods << smokeMixinJar.get().archiveFile.get().asFile.absolutePath
        if (project.hasProperty('optifine')) mods << file(project.property('optifine')).absolutePath
        doFirst {
            args = [
                "java=${launcher.get().executablePath.asFile.absolutePath}",
                "mode=$mode",
                "runtime=${runtimeJar.get().archiveFile.get().asFile.absolutePath}",
                "mods=${mods.join(File.pathSeparator)}",
                "lwjgl3=${lwjgl3}",
                "lwjgl3Jar=${lwjgl3Jar.get().archiveFile.get().asFile.absolutePath}",
                "cache=${rootProject.layout.projectDirectory.dir('.harness-cache').asFile.absolutePath}",
                "gameDir=${layout.buildDirectory.dir("run/$name").get().asFile.absolutePath}",
                "jvmArgs=${project.findProperty('jvmArgs') ?: ''}",
                "timeout=${project.findProperty('timeout') ?: '300'}",
                "shaderPack=${project.hasProperty('shaderPack') ? file(project.property('shaderPack')).absolutePath : ''}",
            ]
        }
    }
}

registerRun('runStock8', 'stock', 8)
registerRun('runLazarus17', 'lazarus', 17)
registerRun('runLazarus21', 'lazarus', 21)
registerRun('runLazarus25', 'lazarus', 25)
registerRun('runBare21', 'bare', 21)
registerRun('runBare25', 'bare', 25)
registerRun('runLwjgl3_17', 'lazarus', 17, true)
registerRun('runLwjgl3_21', 'lazarus', 21, true)
registerRun('runLwjgl3_25', 'lazarus', 25, true)
registerRun('runBareLwjgl3_25', 'bare', 25, true)

// Launches a profile written by the installer, the way the official launcher does. -PmcDir=... -Pprofile=...
tasks.register('runProfile', JavaExec) {
    group = 'lazarus'
    description = 'Launches an installed Lazarus profile from a launcher directory, as the official launcher would.'
    dependsOn smokeJar
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'lol.trq.lazarus.harness.ProfileLaunch'
    def launcher = javaFor((project.findProperty('javaVersion') ?: '21') as int)
    doFirst {
        args = [
            "java=${launcher.get().executablePath.asFile.absolutePath}",
            "mcDir=${project.property('mcDir')}",
            "profile=${project.property('profile')}",
            "cache=${rootProject.layout.projectDirectory.dir('.harness-cache').asFile.absolutePath}",
            "gameDir=${layout.buildDirectory.dir('run/runProfile').get().asFile.absolutePath}",
            "mods=${smokeJar.get().archiveFile.get().asFile.absolutePath}",
            "jvmArgs=${project.findProperty('jvmArgs') ?: ''}",
            "timeout=${project.findProperty('timeout') ?: '300'}",
        ]
    }
}
