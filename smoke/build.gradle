// Test mod for the harness. Java 8 bytecode so stock Forge 1.8.9 can load it too.
repositories {
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'net.minecraftforge' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    compileOnly('net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9:universal') { transitive = false }
    compileOnly 'org.apache.logging.log4j:log4j-api:3.0.0-beta2'
}
