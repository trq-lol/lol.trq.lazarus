plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

base.archivesName = 'lol.trq.lazarus'

java {
    withSourcesJar()
}

// Lazarus runs inside Minecraft on Java 17 through 25, so it targets the oldest of those.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

configurations {
    shade
    asm
    implementation.extendsFrom shade, asm
}

dependencies {
    // Pack200 left the JDK in 14; FML needs it to read its binary patches. Shaded and relocated.
    shade 'org.apache.commons:commons-compress:1.28.0'
    // JSON for the installer, which edits the launcher's files.
    shade 'com.google.code.gson:gson:2.15.0'
    // ASM 9, bundled unrelocated: it replaces Forge's asm-all 5 for FML, Mixin and every legacy ASM user.
    asm 'org.ow2.asm:asm:9.11.1'
    asm 'org.ow2.asm:asm-tree:9.11.1'
    asm 'org.ow2.asm:asm-commons:9.11.1'
    asm 'org.ow2.asm:asm-util:9.11.1'
    asm 'org.ow2.asm:asm-analysis:9.11.1'
    compileOnly 'net.minecraft:launchwrapper:1.12'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.0-beta9'

    testImplementation 'net.minecraft:launchwrapper:1.12'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Fields writes static finals through Unsafe; on Java 22+ that warns unless allowed.
    jvmArgs '--sun-misc-unsafe-memory-access=allow'
}

tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.shade, project.configurations.asm]
    // Only the Commons libraries are relocated; ASM must keep its package, which is what FML links against.
    relocate 'org.apache.commons.compress', 'lol.trq.lazarus.shadow.compress'
    relocate 'org.apache.commons.io', 'lol.trq.lazarus.shadow.io'
    relocate 'org.apache.commons.lang3', 'lol.trq.lazarus.shadow.lang3'
    relocate 'com.google.gson', 'lol.trq.lazarus.shadow.gson'
    relocate 'com.google.errorprone', 'lol.trq.lazarus.shadow.errorprone'
    exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/maven/**'
    manifest {
        attributes(
            'Main-Class': 'lol.trq.lazarus.install.Installer',
            'Premain-Class': 'lol.trq.lazarus.agent.LazarusAgent',
            'Agent-Class': 'lol.trq.lazarus.agent.LazarusAgent',
            'Implementation-Title': 'lol.trq.lazarus',
            'Implementation-Version': project.version,
        )
    }
}

tasks.named('assemble') { dependsOn 'shadowJar' }

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'lol.trq.lazarus'
            from components.shadow
            artifact tasks.named('sourcesJar')
            pom {
                name = 'lol.trq.lazarus'
                description = 'Runs Minecraft Forge 1.8.9 on Java 17 and newer'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0 or later'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/trq-lol/lol.trq.lazarus'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

// org.objectweb.asm.commons.Remapping*Adapter: ASM 6.2.1 sources under ASM's BSD-3-Clause license, kept verbatim
// apart from the api level. Spotless must not rewrite their headers.
spotless {
    java {
        targetExclude 'src/main/java/org/objectweb/**'
    }
}

// The LWJGL 3 option: the compatibility jar travels inside the Lazarus jar, and a manifest of the LWJGL 3 artifacts
// (with per-platform natives, SHA-1 and size) lets the installer write library entries a launcher can download.
evaluationDependsOn(':lwjgl3')
def lwjgl3Version = project(':lwjgl3').ext.lwjgl3Version
def lwjgl3Modules = ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-openal']
def lwjgl3Natives = [
    windows: ['natives-windows'],
    linux: ['natives-linux'],
    osx: ['natives-macos', 'natives-macos-arm64'],
]

configurations {
    lwjgl3Dist { transitive = false }
}

dependencies {
    lwjgl3Modules.each { m ->
        lwjgl3Dist "org.lwjgl:${m}:${lwjgl3Version}"
        lwjgl3Natives.values().flatten().each { c -> lwjgl3Dist "org.lwjgl:${m}:${lwjgl3Version}:${c}" }
    }
}

def lwjgl3Bundle = tasks.register('lwjgl3Bundle') {
    def jar = project(':lwjgl3').tasks.named('jar')
    def out = layout.buildDirectory.dir('generated/lwjgl3Bundle')
    inputs.files(jar)
    inputs.files(configurations.lwjgl3Dist)
    outputs.dir(out)
    doLast {
        def dir = out.get().dir('META-INF/lazarus').asFile
        dir.mkdirs()
        java.nio.file.Files.copy(jar.get().archiveFile.get().asFile.toPath(), new File(dir, 'lwjgl3.jar').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def entries = []
        configurations.lwjgl3Dist.resolvedConfiguration.resolvedArtifacts.each { a ->
            def id = a.moduleVersion.id
            def classifier = a.classifier
            def os = classifier == null ? null : lwjgl3Natives.find { k, v -> v.contains(classifier) }?.key
            def arch = classifier == 'natives-macos-arm64' ? 'arm64' : (classifier == 'natives-macos' ? 'x86_64' : null)
            def path = "${id.group.replace('.', '/')}/${id.name}/${id.version}/${a.file.name}"
            def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(a.file.bytes).encodeHex().toString()
            entries << [
                name: "${id.group}:${id.name}:${id.version}" + (classifier ? ":${classifier}" : ''),
                path: path,
                url: "https://repo1.maven.org/maven2/${path}",
                sha1: sha1,
                size: a.file.length(),
                os: os,
                arch: arch,
            ]
        }
        new File(dir, 'lwjgl3-libraries.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([version: lwjgl3Version, libraries: entries.sort { it.name }]))
    }
}

tasks.named('shadowJar') {
    dependsOn lwjgl3Bundle
    from(lwjgl3Bundle)
}
