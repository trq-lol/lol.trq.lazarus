name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck build
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :runtime:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Boots real Forge 1.8.9 with a Mixin 0.7 mod on each supported Java, under a virtual display with software
  # OpenGL, and fails unless the main menu is reached and the mixin applied.
  boot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libxxf86vm1 libxrandr2 libxcursor1 libxi6 x11-xserver-utils
      - uses: actions/cache@v4
        with:
          path: .harness-cache
          key: harness-${{ hashFiles('harness/src/**') }}
          restore-keys: harness-
      - name: Boot Forge 1.8.9 on Java ${{ matrix.java }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :harness:runLazarus${{ matrix.java }} -Pmixin -Ptimeout=900 | tee boot.log
          grep -q "LAZARUS-SMOKE OK at=menu java=${{ matrix.java }}" boot.log
          grep -q "LAZARUS-MIXIN OK" boot.log
          grep -q 'LAZARUS-PROBE sys=${sys:java.vendor}' boot.log
          grep -q "LAZARUS-LOG4SHELL jndiConnected=false" boot.log
