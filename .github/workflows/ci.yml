name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck build
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :runtime:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Boots real Forge 1.8.9 with a Mixin 0.7 mod on each supported Java, under a virtual display with software
  # OpenGL, and fails unless the main menu and a world are reached and the mixin applied. One job runs the core
  # renderer and fails on any driver-reported GL error.
  boot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
        lwjgl: [2, 3]
        gl: [compat]
        include:
          - java: 25
            lwjgl: 3
            gl: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libxxf86vm1 libxrandr2 libxcursor1 libxi6 x11-xserver-utils
      - uses: actions/cache@v4
        with:
          path: .harness-cache
          key: harness-${{ hashFiles('harness/src/**') }}
          restore-keys: harness-
      - name: Boot Forge 1.8.9 on Java ${{ matrix.java }}, LWJGL ${{ matrix.lwjgl }}, ${{ matrix.gl }} OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          task=${{ matrix.lwjgl == 3 && format('runLwjgl3_{0}', matrix.java) || format('runLazarus{0}', matrix.java) }}
          jvm="-Dlazarus.smoke.world=true"
          if [ "${{ matrix.gl }}" = core ]; then jvm="$jvm -Dlazarus.gl.debug=true -Dlazarus.smoke.postShader=invert -Dlazarus.smoke.hurt=true"; else jvm="$jvm -Dlazarus.gl=compat"; fi
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :harness:$task -Pmixin -Ptimeout=900 "-PjvmArgs=$jvm" | tee boot.log
          grep -q "LAZARUS-SMOKE OK at=menu java=${{ matrix.java }}" boot.log
          grep -q "LAZARUS-MIXIN OK" boot.log
          grep -q 'LAZARUS-PROBE sys=${sys:java.vendor}' boot.log
          grep -q "LAZARUS-LOG4SHELL jndiConnected=false" boot.log
          grep -q "LAZARUS-SMOKE OK at=world" boot.log
          ! grep -q "CVE-2026-114938 (Java4Shell)" boot.log
          ! grep -q "\[lazarus\] GL error" boot.log
          ! grep -q "Couldn't compile" boot.log
